<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DualRead 개인용</title>
    <link rel="stylesheet" href="ui.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <main>
      <header><h1>DualRead</h1><button id="settings" type="button" class="quiet">설정</button></header>
      <div class="route">
        <span class="label">번역할 텍스트의 전송 대상</span>
        <strong id="destination">설정을 확인하는 중…</strong>
        <a id="usage" href="https://chatgpt.com/settings/usage" target="_blank" rel="noopener noreferrer" hidden>ChatGPT 사용량 관리</a>
      </div>
      <div class="actions">
        <button id="all" class="primary" type="button" disabled>페이지 전체 번역 켜기·끄기 <kbd id="all-shortcut"></kbd></button>
        <button id="selected" type="button" disabled>드래그한 글만 번역 <kbd id="selection-shortcut"></kbd></button>
        <button id="pick" type="button" disabled>문단 골라 번역</button>
        <button id="clear" type="button" class="quiet">번역 지우기</button>
      </div>
      <p id="shortcut-help" hidden>표시되지 않은 단축키는 <code>chrome://extensions/shortcuts</code>에서 DualRead에 지정하세요.</p>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
